name: bus_tracker
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.2.0
  cupertino_icons: ^1.0.8

  firebase_database: ^11.3.7

  # Update firebase_core to the 3.x.x series (compatible with firebase_auth >= 5.4.1)
  firebase_core: ^3.10.1  # Latest version in the 3.x.x series

  # Update firebase_auth to a version that works with firebase_core ^3.x.x
  firebase_auth: ^5.4.1  # Latest compatible version

  # You can add other Firebase dependencies here (e.g., Cloud Firestore, etc.)
  cloud_firestore: ^5.0.0 

  fluttertoast: ^8.2.12  # For showing toast messages
  
   # Make sure this is compatible with firebase_core ^3.x.x
  google_sign_in: ^6.2.2
  firebase_storage: ^12.4.5
  image_picker: ^1.1.2 #for the image
  share_plus: ^10.1.4
  google_maps_flutter: ^2.10.1
  geolocator: ^14.0.0 # for location
  google_fonts: ^6.2.1 # font style
  dotted_border: ^2.0.0
  path: ^1.8.3 
  supabase_flutter: ^2.9.0
  uuid: ^4.0.0
  http: ^1.4.0
  flutter_typeahead: ^4.1.0
  intl: ^0.19.0
  logger: ^1.1.0
  fl_chart: ^1.0.0
  font_awesome_flutter: ^10.5.0
  carousel_slider: ^5.1.1 # swiper
  smooth_page_indicator: ^1.2.1 # points indicator for swiper

  flutterwave_standard: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
   
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/